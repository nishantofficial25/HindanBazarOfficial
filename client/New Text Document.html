<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aadhaar Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(to bottom, #7f1d1d, #991b1b);
            min-height: 100vh;
            color: white;
            position: relative;
            padding-bottom: 80px;
        }

        .header {
            display: flex;
            align-items: center;
            padding: 16px;
            padding-bottom: 24px;
        }

        .back-icon {
            width: 32px;
            height: 32px;
            margin-right: 12px;
            cursor: pointer;
        }

        .header-title {
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .steps-navigation {
            background-color: #f3f4f6;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 24px;
            font-size: 14px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
        }

        .step-number.active {
            background-color: #7f1d1d;
            color: white;
        }

        .step-number.inactive {
            background-color: #9ca3af;
            color: white;
        }

        .step-label {
            font-weight: 500;
        }

        .step-label.active {
            color: #111827;
        }

        .step-label.inactive {
            color: #6b7280;
        }

        .step-line {
            width: 96px;
            height: 2px;
            background-color: #7f1d1d;
            margin-left: 8px;
        }

        .main-content {
            padding: 24px;
        }

        .content-card {
            background-color: #f3f4f6;
            border-radius: 8px;
            padding: 24px;
            color: #374151;
        }

        .card-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .status-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 32px;
        }

        .status-label {
            color: #4b5563;
            font-weight: 500;
        }

        .status-value {
            color: #dc2626;
            font-weight: 600;
        }

        .consent-text {
            text-align: center;
            margin-bottom: 24px;
            color: #4b5563;
            font-size: 16px;
        }

        .auth-button {
            width: 100%;
            background-color: #7f1d1d;
            color: white;
            padding: 16px;
            border-radius: 8px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            opacity: 0.9;
        }

        .auth-button:hover {
            opacity: 1;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #f3f4f6;
            padding: 16px;
            display: flex;
            gap: 12px;
        }

        .nav-button {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            border: none;
        }

        .nav-button.previous {
            background-color: transparent;
            border: 2px solid #9ca3af;
            color: #6b7280;
        }

        .nav-button.next {
            background-color: #7f1d1d;
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal-content {
            background-color: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .error-icon-wrapper {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: #fef2f2;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .error-icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-icon {
            width: 32px;
            height: 32px;
            color: #ef4444;
        }

        .modal-title {
            font-size: 30px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 12px;
        }

        .modal-message {
            color: #6b7280;
            font-size: 18px;
            margin-bottom: 32px;
            text-align: center;
        }

        .modal-button {
            width: 100%;
            background-color: #7f1d1d;
            color: white;
            padding: 16px;
            border-radius: 8px;
            border: none;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .modal-button:hover {
            background-color: #991b1b;
        }

        .bottom-indicator {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background-color: white;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <svg class="back-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        <h1 class="header-title">Application Details</h1>
    </div>

    <!-- Steps Navigation -->
    <div class="steps-navigation">
        <div class="step">
            <div class="step-number active">6</div>
            <span class="step-label active">Document Upload</span>
            <div class="step-line"></div>
        </div>
        <div class="step">
            <div class="step-number inactive">7</div>
            <span class="step-label inactive">Preview</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="content-card">
            <h2 class="card-title">Upload Documents</h2>
            
            <div class="status-row">
                <span class="status-label">Photo Upload:</span>
                <span class="status-value">Pending</span>
            </div>

            <button class="auth-button">
                <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
                Aadhaar Face Authentication
            </button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-button previous">Previous</button>
        <button class="nav-button next">Save & Next</button>
    </div>

    <!-- Error Modal -->
    <div class="modal-overlay" id="errorModal">
        <div class="modal-content">
            <div class="modal-inner">
                <div class="error-icon-wrapper">
                    <div class="error-icon-circle">
                        <svg class="error-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
                
                <h3 class="modal-title">Error</h3>
                <p class="modal-message">Image not uploaded!</p>
                <p class="modal-message">Allowed size : 20kb to 50kb <br>Dimensions : 3.5cm(width) x 4.5cm(height)</p>
                <button class="modal-button" onclick="closeModal()">OK</button>
            </div>
        </div>
    </div>

    <!-- Bottom Indicator -->
    <div class="bottom-indicator"></div>

    <script>
        function closeModal() {
            document.getElementById('errorModal').classList.add('hidden');
        }
    </script>
</body>
</html>
